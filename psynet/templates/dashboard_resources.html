{% extends "psynet_dashboard.html" %}
{% block scripts %}
    <script src="/static/scripts/d3.v4.js"></script>
    <script src="/static/scripts/d3-tip.min.js"></script>
    <script src="/static/scripts/d3-visualizations.js"></script>
{% endblock %}
{% block stylesheets %}
    {{ super() }}
    <link rel="stylesheet" href="/static/css/d3-tip.css">
{% endblock %}
{% block body %}
    <style>
        /* Bootstrap makes labels inline-block, which would size the inputs
           relative to their label instead of the row. */
        .selector label {
            display: inline;
        }

        .selector input[type="range"] {
            width: 35%;
        }
    </style>
    <h1>{{ title }}</h1>

    {{ html }}
    {% if data | length > 0 %}
        <div class="selector">
            <div>
                <label>From <input type="range" id="range-from" step="1"></label>
                <label>To <input type="range" id="range-to" step="1"></label>
                <span id="min"></span>
                <span class="seperator">-</span>
                <span id="max"></span>
            </div>
        </div>
        <div id="lineplot"></div>
        <script>
            var data = {{ data | tojson }};
            let x2timestamp = {};
            data.forEach(function (d) {
                x2timestamp[d.x] = d.timestamp;
            });
            const plotTimeWindow = 2 * 60;  // 2 hours, status recorded every minute
            const max = Object.keys(x2timestamp).length - 1;
            const value = max > plotTimeWindow ? plotTimeWindow : max;
            const min = 0;
            const margin = {"top": 10, "right": 30, "bottom": 30, "left": 40},
                xLabel = "Time",
                yLabel = "Usage",
                height = 500,
                yLimits = [0, 150];


            function draw(start = min, end = max) {
                $("#lineplot").empty();
                let filteredData = data.filter(function (d) {
                    return d.x >= start && d.x <= end;
                });
                let type2color = {};
                const uniqueTypes = [...new Set(data.map(d => d.type))]
                uniqueTypes.forEach(function (type, i) {
                    type2color[type] = d3.schemeCategory10[i];
                });

                let tooltip = d3.tip().attr('class', 'd3-tip')
                    .html(function (d) {
                        let out = '<strong>' + d.timestamp + '</strong>';
                        let color = d.type in type2color ? type2color[d.type] : 'black';
                        out += '<br><span style="color:' + color + '; font-weight: bold">' + d.type + '</span> ';
                        out += d.label;
                        return out;
                    });

                linePlot('lineplot', filteredData, margin, xLabel, yLabel, tooltip, height, yLimits, type2color, x2timestamp);
            }

            // x counts back from the newest status, so the inputs run from -max
            // (oldest) to 0 (newest).
            function createSlider() {
                const inputs = [document.getElementById("range-from"), document.getElementById("range-to")];
                inputs.forEach(function (input) {
                    input.min = -max;
                    input.max = -min;
                });
                inputs[0].value = -value;
                inputs[1].value = -min;

                function update() {
                    const values = inputs.map(input => input.valueAsNumber);
                    const start = -Math.max(...values);
                    const end = -Math.min(...values);
                    $("#max").text(x2timestamp[start]);
                    $("#min").text(x2timestamp[end]);
                    draw(start, end);
                }

                inputs.forEach(input => input.addEventListener("input", update));
                update();
            }

            document.addEventListener("DOMContentLoaded", createSlider);
        </script>
    {% endif %}

{% endblock %}
{% block libs %}
    {{ super() }}

{% endblock %}
