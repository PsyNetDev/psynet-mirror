{% extends "psynet_layout.html" %}

{% block stylesheets %}
    {{ super() }}
    <style>
        /* Selectors are scoped: bare `div` and `p` rules previously also matched
           the layout's spinner element, which gave the page a stray empty
           screen below the fold. */
        #starting-experiment {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 1.5rem;
            min-height: 100vh;
            text-align: center;
        }

        #starting-experiment p {
            margin: 0;
            font-size: clamp(1.25rem, 3vw, 1.75rem);
            font-weight: 600;
            letter-spacing: -0.015em;
        }

        #starting-experiment .spinner-border {
            width: 2.5rem;
            height: 2.5rem;
            border-width: 0.25rem;
            color: var(--psynet-accent);
        }
    </style>
{% endblock %}

{% block body %}
    {{super()}}

    <div id="starting-experiment">
        <div class="spinner-border" role="status" aria-hidden="true"></div>
        <p>
            {{ pgettext("start", "Starting experiment...") }}
        </p>
    </div>
{% endblock %}


{% block scripts %}
{{super()}}
    <script>
        function getEntryInformation() {
            let entryInformation = {};
            let queryParams = new URLSearchParams(location.search);
            for (const [k, v] of queryParams) {
                if (k !== "mode") {
                    entryInformation[k] = v;
                }
            }
            return entryInformation
        }

        async function getFingerprintHash() {
            return new Promise((resolve) => {
                new Fingerprint2().get((result) => resolve(result))
            })
        }

        function shouldAttemptCreate(resp) {
            return Boolean(
                resp &&
                resp.status === 403 &&
                (resp.errorCode === "participant_not_found" ||
                 resp.errorCode === "assignment_id_missing")
            );
        }

        let startInProgress = false;
        let startAttempt = 0;

        function handleStartError(resp, attempt) {
            if (attempt !== startAttempt) {
                return;
            }
            startInProgress = false;
            // TODO(Dallinger structured participant errors): Replace this last
            // dallinger.error() call with psynetErrorPage.go() once /participant
            // and /load-participant return stable error codes for refusals such
            // as worker_already_participated. Do not infer codes by parsing the
            // current rendered HTML or its human-readable error text.
            dallinger.error(resp);
        }

        async function createParticipant(entryInformation, attempt) {
            // This is similar to dallinger.createParticipant but it bypasses the dallinger.identity
            // storage object, which shares information across different browser windows and hence
            // is not reliable when testing multiple participants on the same machine.

            if (!entryInformation) {
                entryInformation = getEntryInformation();
            }
            let fingerprintHash = await getFingerprintHash();
            if (attempt !== startAttempt) {
                return;
            }
            let data = Object.assign(
                {},
                entryInformation,
                {fingerprint_hash: fingerprintHash}
            );

            dallinger.post("/participant", data).done(function (resp) {
                if (attempt !== startAttempt) {
                    return;
                }
                window.location.replace("/timeline?unique_id=" + resp.participant.unique_id);
            }).fail(function(resp) {
                handleStartError(resp, attempt);
            });
        }

        function startParticipantFlow() {
            if (startInProgress) {
                return;
            }
            startInProgress = true;
            const attempt = ++startAttempt;
            let entryInformation = getEntryInformation();
            if (Object.keys(entryInformation).length > 0) {
                dallinger.post("/load-participant", entryInformation).done(function (resp) {
                    if (attempt !== startAttempt) {
                        return;
                    }
                    window.location.replace("/timeline?unique_id=" + resp.participant.unique_id);
                }).fail(function(resp) {
                    if (attempt !== startAttempt) {
                        return;
                    }
                    if (shouldAttemptCreate(resp)) {
                        createParticipant(entryInformation, attempt);
                    } else {
                        handleStartError(resp, attempt);
                    }
                });
            } else {
                createParticipant(entryInformation, attempt);
            }
        }

        // pageshow runs on first load and when the page is restored (including
        // bfcache). Reset the in-progress flag after a persisted restore so
        // /start can run again after back/forward navigation.
        window.addEventListener("pageshow", function (event) {
            if (event.persisted) {
                startInProgress = false;
            }
            startParticipantFlow();
        });
    </script>
{% endblock %}
