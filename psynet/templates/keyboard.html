{% extends "timeline-page.html" %}

{% block main_body %}
<link rel="stylesheet" href="{{ url_for('static', filename='international-keyboards/international-keyboards.css') }}"/>
<script src="{{ url_for('static', filename='international-keyboards/international-keyboards.js') }}"></script>

{% macro keyboard() %}
    <div id="keyboard"></div>
        {{ gettext("Select a keyboard layout:") }}
        <select class="form-control" id="keyboardIDs"></select>
{% endmacro %}


<div class="row">
    <div class="col-md-6">{{ prompt }}</div>
    <div class="col-md-6">{{ keyboard() }}</div>
</div>

<script>
    let keyboardState = (psynet.page.control.keyboard = {
        pressedKeys: [],
        instance: undefined,
    });

    async function createKeyboard(autoCorrectType = true) {
        $('#keyboard').empty();
        let keyboardIDs = $('#keyboardIDs');
        let keyboardID = keyboardIDs.val();
        let fallbackType = 'ANSI';
        let keyboardType = fallbackType;
        let currentKeyboard = keyboardIDs.find(`[value="${keyboardID}"]`)[0];
        let addLatinKeys = currentKeyboard.getAttribute('addLatinKeys') === 'true';

        if (autoCorrectType) {
            keyboardType = currentKeyboard?.getAttribute('type') || fallbackType;
            $('#keyboardType').val(keyboardType);
        }
        keyboardState.instance = new InternationalKeyboard({
            keyboardID,
            containerID: 'keyboard',
            addLatinKeys,
            keyboardType,
            cssStyle: psynet.var.cssStyle,
            showKeys: psynet.var.showKeys,
            highlightedKeys: psynet.var.highlightKeys
        });
    }


    const isSubset = (array1, array2) => array2.every(element => array1.includes(element));

    psynet.setRetrieveResponseHandler(function() {
        let keyboardIDs = document.getElementById("keyboardIDs");
        return { rawAnswer: keyboardIDs ? keyboardIDs.value : null };
    })

    function onNextButton(button) {
        psynet.captureSubmissionControlState();
        psynet.showSubmissionSpinner(button);
        button.disabled = true;
        psynet.submitResponse();
    }

    psynet.trial.onEvent("trialConstruct", function () {
        let keyboardIDs = document.getElementById("keyboardIDs");
        let nextButton = document.getElementById("next-button");

        psynet.addPageEventListener(document, "keypress", function (e) {
            let keyCode = e.code;
            keyboardState.pressedKeys.push(keyCode);
            if (keyboardState.instance) {
                keyboardState.instance.press(keyCode);
            }
        });

        $.getJSON('/static/international-keyboards/default-keyboard-layout.json').done(function (defaultLayouts) {
            Object.entries(defaultLayouts).forEach(([iso, config]) => {
                let group = `<optgroup label="${config.label}">`;
                config.variants.forEach(variant => {
                    group += `<option addLatinKeys="${config.addLatinKeys}" keyVariant="${config.keyVariant}" type="${variant.type}" value="${variant.name}">${variant.name}</option>`;
                });
                group += "</optgroup>";
                $('#keyboardIDs').append($(group));
            });

            createKeyboard(false);
        });

        psynet.addPageEventListener(keyboardIDs, "change", function () {
            createKeyboard();
        });

        psynet.addPageEventListener(nextButton, "click", function () {
            if (isSubset(keyboardState.pressedKeys, psynet.var.pressKeys)) {
                onNextButton(nextButton);
            } else {
                psynet.alert({{ gettext("You did not press all required keys.") | tojson }});
            }
        });
    });
</script>

<button type="button" id="next-button" class="btn btn-primary btn-lg submit" disabled>
    {{ gettext("Next") }}
</button>
{% endblock %}
