  <rect x="166" y="62" width="94" height="38" rx="8" fill="#dbeafe" stroke="#1d4ed8" stroke-width="1.5"/>
  <text x="213" y="86" text-anchor="middle" font-size="14" fill="#111827">Painting B</text>
  <path d="M263 81h11" stroke="#6b7280" stroke-width="1.5" marker-end="url(#arrow)"/>
  <rect x="278" y="62" width="94" height="38" rx="8" fill="#dbeafe" stroke="#1d4ed8" stroke-width="1.5"/>
  <text x="325" y="86" text-anchor="middle" font-size="14" fill="#111827">Painting C</text>
