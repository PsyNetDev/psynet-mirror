<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 382 112" width="382" height="112" role="img" aria-labelledby="title" font-family="system-ui, -apple-system, Helvetica, Arial, sans-serif">
  <title id="title">One sorting page holds three painting trials</title>
  <defs>
    <marker id="arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="5" markerHeight="5" orient="auto">
      <path d="M0 0L8 4L0 8Z" fill="#6b7280"/>
    </marker>
  </defs>
  <rect width="382" height="112" rx="10" fill="#fff"/>
  <text x="10" y="36" font-size="13" font-weight="600" fill="#4b5563">Pages</text>
  <rect x="54" y="12" width="318" height="38" rx="8" fill="#f3f4f6" stroke="#4b5563" stroke-width="1.5"/>
  <text x="213" y="36" text-anchor="middle" font-size="14" fill="#111827">Swipe through the paintings</text>
  <text x="10" y="86" font-size="13" font-weight="600" fill="#1d4ed8">Trials</text>
