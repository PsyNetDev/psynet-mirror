<text x="308.0" y="48.5" font-size="13.5" fill="#111827" text-anchor="middle">Wait for the</text>
<text x="308.0" y="63.5" font-size="13.5" fill="#111827" text-anchor="middle">room</text>
<line x1="361" y1="46.0" x2="371" y2="46.0" stroke="#6b7280" stroke-width="1.5" marker-end="url(#arrow)"/>
<rect x="376" y="16" width="100" height="60" rx="8" fill="#f3f4f6" stroke="#4b5563" stroke-width="1.5"/>
<text x="426.0" y="31" font-size="10" font-weight="600" letter-spacing="0.6" fill="#4b5563" text-anchor="middle">PAGE</text>
<text x="426.0" y="56.0" font-size="13.5" fill="#111827" text-anchor="middle">See who won</text>
