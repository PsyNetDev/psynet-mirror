<line x1="351" y1="46.0" x2="361" y2="46.0" stroke="#6b7280" stroke-width="1.5" marker-end="url(#arrow)"/>
<rect x="366" y="16" width="100" height="60" rx="8" fill="#dcfce7" stroke="#15803d" stroke-width="1.5"/>
<text x="416.0" y="31" font-size="10" font-weight="600" letter-spacing="0.6" fill="#15803d" text-anchor="middle">GROUP PAGE</text>
<text x="416.0" y="48.5" font-size="13.5" fill="#111827" text-anchor="middle">Result, with</text>
