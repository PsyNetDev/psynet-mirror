<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 260" role="img" aria-label="A chat between a researcher and a coding agent">
  <rect x="0" y="0" width="400" height="260" rx="16" fill="#eef1f6"/>
  <rect x="24" y="20" width="352" height="220" rx="12" fill="#ffffff" stroke="#dfe5ee" stroke-width="2"/>
  <circle cx="44" cy="38" r="4" fill="#c3cedd"/>
  <circle cx="58" cy="38" r="4" fill="#c3cedd"/>
  <circle cx="72" cy="38" r="4" fill="#c3cedd"/>
  <line x1="24" y1="54" x2="376" y2="54" stroke="#dfe5ee" stroke-width="2"/>

  <!-- Researcher's request, right-aligned -->
  <rect x="150" y="70" width="206" height="62" rx="12" fill="#3070c8"/>
  <rect x="166" y="84" width="150" height="7" rx="3.5" fill="#ffffff" opacity="0.9"/>
  <rect x="166" y="98" width="174" height="7" rx="3.5" fill="#ffffff" opacity="0.9"/>
  <rect x="166" y="112" width="110" height="7" rx="3.5" fill="#ffffff" opacity="0.9"/>

  <!-- Agent's plan, left-aligned, with a numbered list -->
  <rect x="44" y="146" width="220" height="78" rx="12" fill="#eaf1fb"/>
  <circle cx="62" cy="164" r="6" fill="#3070c8"/>
  <rect x="76" y="160" width="140" height="7" rx="3.5" fill="#5c6b7f" opacity="0.6"/>
  <circle cx="62" cy="184" r="6" fill="#3070c8"/>
  <rect x="76" y="180" width="164" height="7" rx="3.5" fill="#5c6b7f" opacity="0.6"/>
  <circle cx="62" cy="204" r="6" fill="#3070c8"/>
  <rect x="76" y="200" width="118" height="7" rx="3.5" fill="#5c6b7f" opacity="0.6"/>
</svg>
