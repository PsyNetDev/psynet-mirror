<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 260" role="img" aria-label="A dashboard showing participants arriving and progress towards the target">
  <rect x="0" y="0" width="400" height="260" rx="16" fill="#eef1f6"/>
  <rect x="24" y="20" width="352" height="220" rx="12" fill="#ffffff" stroke="#dfe5ee" stroke-width="2"/>

  <!-- Three summary tiles -->
  <rect x="44" y="40" width="96" height="52" rx="8" fill="#f7f9fc" stroke="#dfe5ee" stroke-width="2"/>
  <rect x="56" y="54" width="36" height="12" rx="4" fill="#3070c8"/>
  <rect x="56" y="74" width="60" height="6" rx="3" fill="#5c6b7f" opacity="0.5"/>
  <rect x="152" y="40" width="96" height="52" rx="8" fill="#f7f9fc" stroke="#dfe5ee" stroke-width="2"/>
  <rect x="164" y="54" width="44" height="12" rx="4" fill="#2f7d5b"/>
  <rect x="164" y="74" width="52" height="6" rx="3" fill="#5c6b7f" opacity="0.5"/>
  <rect x="260" y="40" width="96" height="52" rx="8" fill="#f7f9fc" stroke="#dfe5ee" stroke-width="2"/>
  <rect x="272" y="54" width="30" height="12" rx="4" fill="#5c6b7f" opacity="0.7"/>
  <rect x="272" y="74" width="64" height="6" rx="3" fill="#5c6b7f" opacity="0.5"/>

  <!-- Participants over time -->
  <polyline points="48,196 88,188 128,170 168,160 208,138 248,128 288,114 328,108 352,104"
            fill="none" stroke="#3070c8" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  <line x1="44" y1="200" x2="356" y2="200" stroke="#c3cedd" stroke-width="2"/>

  <!-- Progress towards the target -->
  <rect x="44" y="214" width="312" height="10" rx="5" fill="#eaf1fb"/>
  <rect x="44" y="214" width="218" height="10" rx="5" fill="#3070c8"/>
</svg>
