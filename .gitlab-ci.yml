# Scratch: seed the shared CI image cache for MR !1279 measurements (not for merging).
image: docker:26.1.1

services:
  - docker:26.1.1-dind

variables:
  DOCKER_LOCAL_TAG: psynet-build
  PYTHON_VERSION: "3.13"
  DOCKER_HOST: tcp://docker:2375
  DOCKER_DRIVER: overlay2
  DOCKER_TLS_CERTDIR: ""
  CI_COMMIT_REF_PROTECTED: "true"

seed_base:
  script:
    - sh ci/ci-image.sh base

seed_playwright:
  script:
    - sh ci/ci-image.sh playwright
