image: docker:26.1.1

workflow:
  auto_cancel:
    on_new_commit: interruptible
  rules:
    # Avoid duplicate pipelines: when a branch has an open MR, only run the
    # MR pipeline (not the branch pipeline) for pushes to that branch.
    - if: $CI_PIPELINE_SOURCE == "push" && $CI_OPEN_MERGE_REQUESTS && $CI_COMMIT_BRANCH != $CI_DEFAULT_BRANCH
      when: never
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
    - if: $CI_COMMIT_TAG
    - if: $CI_COMMIT_BRANCH

default:
  interruptible: true

services:
  - docker:26.1.1-dind
  - postgres:16.2-bookworm
  - redis:latest

variables:
  AWS_ACCESS_KEY_ID: $AWS_ACCESS_KEY_ID
  AWS_DEFAULT_REGION: $AWS_DEFAULT_REGION
  AWS_SECRET_ACCESS_KEY: $AWS_SECRET_ACCESS_KEY
  POSTGRES_DB: dallinger
  POSTGRES_USER: dallinger
  POSTGRES_PASSWORD: ""
  POSTGRES_HOST_AUTH_METHOD: trust
  DATABASE_URL: postgresql://dallinger@postgres:5432/dallinger
  REDIS_URL: redis://redis:6379
  HEADLESS: "TRUE"
  DOCKER_LOCAL_TAG: psynet-build
  PYTHON_VERSION: "3.13"
  DOCKER_HOST: tcp://docker:2375
  DOCKER_DRIVER: overlay2
  DOCKER_TLS_CERTDIR: ""

before_script:
  - export POSTGRES_IP=$(getent ahostsv4 postgres | awk '{ print $1 }' | tail -n 1)
  - export REDIS_IP=$(getent ahostsv4 redis | awk '{ print $1 }' | tail -n 1)
  - echo $POSTGRES_IP
  - echo $REDIS_IP
  - docker build --build-arg PYTHON_VERSION=$PYTHON_VERSION --tag $DOCKER_LOCAL_TAG .

.default_rules: &default_rules
  rules:
    - if: $CI_MERGE_REQUEST_ID
      when: always
    - if: $CI_COMMIT_BRANCH
      when: always
    - if: $CI_COMMIT_TAG
      when: always

# Docker pytest / Playwright jobs. MR pipelines skip these when the diff
# cannot affect experiment runtime, tests, demos, or the CI image. Default
# branch, tags, and branch pipelines without an MR still always run them.
#
# The `changes` list is an allowlist, so a path missing from it silently
# skips the tests on MRs that touch only that path. When you add a top-level
# file or directory that tests, the CI image, or packaging depend on, or a
# test that reads a docs page, add it here. GitLab `changes` patterns cannot
# exclude paths, so "everything except docs/" cannot be written instead.
.docker_test_rules: &docker_test_rules
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      changes:
        - .gitlab-ci.yml
        - .cursor/skills/experiment/**/*
        - Dockerfile
        - Dockerfile.playwright
        - MANIFEST.in
        - benchmarks/**/*
        - ci/**/*
        - demos/**/*
        - docs/scripts/**/*
        # Docs pages whose content is checked by isolated tests.
        - docs/dependencies/docker.rst
        - docs/deploy/index.rst
        - docs/developer/timeline_hold_traces.rst
        - docs/experiment_development/experiment_directory.rst
        - deployment-tests/**/*
        - dev-requirements.in
        - install-ci-dependencies.sh
        - package-lock.json
        - package.json
        - playwright.config.js
        - postgres_setup.sql
        - psynet/**/*
        - pyproject.toml
        - pytest.ini
        - run-ci-tests.sh
        - scripts/**/*
        - tests/**/*
      when: always
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      when: never
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
      when: always
    - if: $CI_COMMIT_TAG
      when: always
    - if: $CI_COMMIT_BRANCH
      when: always

pre_commit:
  image: python:3.13
  <<: *default_rules
  services: []
  before_script:
    - pip install pre-commit
  script:
    - pre-commit run --all-files

validate_agent_skills:
  image: python:3.13
  <<: *default_rules
  services: []
  before_script:
    - pip install pyyaml skills-ref
  script:
    - python scripts/validate_agent_skills.py

changelog_check:
  image: python:3.13
  stage: test
  services: []
  # Importing ``psynet.dev.changelog`` from the checkout needs only ``click``
  # (via ``psynet.version``); ``.[dev]`` would also pull Dallinger and Sphinx.
  before_script:
    - pip install -q click
  script:
    - |
      git fetch --unshallow origin || git fetch --depth=100 origin
      git fetch origin $CI_MERGE_REQUEST_TARGET_BRANCH_NAME
      MERGE_BASE=$(git merge-base origin/$CI_MERGE_REQUEST_TARGET_BRANCH_NAME HEAD)
      python - <<PY
      from psynet.dev.changelog import check_mr_command
      try:
          raise SystemExit(check_mr_command("$MERGE_BASE", "HEAD"))
      except ValueError as exc:
          print(exc)
          raise SystemExit(1)
      PY
  rules:
    # Release branches regenerate CHANGELOG.md from fragments.
    - if: $CI_COMMIT_BRANCH =~ /^release-/ || $CI_MERGE_REQUEST_SOURCE_BRANCH_NAME =~ /^release-/
      when: never
    # Post-release version bumps are release bookkeeping, not user-facing changes.
    - if: $CI_COMMIT_BRANCH == "bump-master-post-release" || $CI_MERGE_REQUEST_SOURCE_BRANCH_NAME == "bump-master-post-release"
      when: never
    - if: $CI_MERGE_REQUEST_ID
      when: always
    - when: never

.release_branch_only: &release_branch_only
  rules:
    - if: $CI_COMMIT_BRANCH =~ /^release-/ || $CI_MERGE_REQUEST_SOURCE_BRANCH_NAME =~ /^release-/
      when: always
    - when: never

# Shared definition of a PsyNet test-suite job, parameterized by PYTHON_VERSION
# and TEST_SCOPE.
#
# run-ci-tests.sh splits tests by CI_NODE_INDEX/CI_NODE_TOTAL, but GitLab owns
# those variables: for `parallel:matrix` jobs it numbers them across all
# permutations rather than within one, so a matrix job cannot set them directly.
# Shard coordinates therefore travel as SHARD_INDEX/SHARD_TOTAL and are mapped
# on to CI_NODE_* below, falling back to GitLab's own numbering when unset. That
# keeps plain `parallel: N` jobs working unchanged while letting matrix jobs
# declare a shard dimension of their own.
.test_suite:
  parallel: 10
  stage: test
  <<: *docker_test_rules
  variables:
    TEST_SCOPE: full
  script:
    - nproc; free -m
    - mkdir -p public
    - (while true; do echo "$(date +%s) $(head -1 /proc/stat) $(grep MemAvailable /proc/meminfo)"; sleep 15; done > public/resource_${CI_JOB_NAME_SLUG}.log) &
    - export PSYNET_WORKSPACE=/root/workspaces/PsyNet
    - docker run
      --add-host=postgres:$POSTGRES_IP
      --add-host=redis:$REDIS_IP
      -e HEADLESS=TRUE -e REDIS_URL -e DATABASE_URL -e POSTGRES_DB -e POSTGRES_USER -e POSTGRES_PASSWORD
      -e AWS_ACCESS_KEY_ID -e AWS_DEFAULT_REGION -e AWS_SECRET_ACCESS_KEY
      -e CI
      -e CI_NODE_TOTAL="${SHARD_TOTAL:-$CI_NODE_TOTAL}"
      -e CI_NODE_INDEX="${SHARD_INDEX:-$CI_NODE_INDEX}"
      -e CI_COMMIT_REF_NAME
      -e SKIP_PYTHON_VERSION_CHECK
      -e PYTHON_VERSION -e TEST_SCOPE -e TEST_SLOTS -e CI_SKIP_NULL_TRANSLATION
      -e PSYNET_WORKSPACE
      -v "$PWD:$PSYNET_WORKSPACE"
      -v "$PWD/public:/public"
      -w $PSYNET_WORKSPACE
      $DOCKER_LOCAL_TAG bash -c "bash run-ci-tests.sh"
  artifacts:
    paths:
      - public/

# Scratch experiment: compare shard/slot layouts. Not for merging.
exp_b10x1:
  extends: .test_suite
  parallel: 10
  variables:
    PYTHON_VERSION: "3.13"
    TEST_SLOTS: "1"

exp_b5x2:
  extends: .test_suite
  parallel: 5
  variables:
    PYTHON_VERSION: "3.13"
    TEST_SLOTS: "2"

exp_b4x3:
  extends: .test_suite
  parallel: 4
  variables:
    PYTHON_VERSION: "3.13"
    TEST_SLOTS: "3"

exp_b5x2_notr:
  extends: .test_suite
  parallel: 5
  variables:
    PYTHON_VERSION: "3.13"
    TEST_SLOTS: "2"
    CI_SKIP_NULL_TRANSLATION: "1"

exp_m3x4:
  extends: .test_suite
  parallel: 3
  tags:
    - saas-linux-medium-amd64
  variables:
    PYTHON_VERSION: "3.13"
    TEST_SLOTS: "4"

