image: docker:26.1.1

workflow:
  auto_cancel:
    on_new_commit: interruptible
  rules:
    # Avoid duplicate pipelines: when a branch has an open MR, only run the
    # MR pipeline (not the branch pipeline) for pushes to that branch.
    - if: $CI_PIPELINE_SOURCE == "push" && $CI_OPEN_MERGE_REQUESTS && $CI_COMMIT_BRANCH != $CI_DEFAULT_BRANCH
      when: never
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
    - if: $CI_COMMIT_TAG
    - if: $CI_COMMIT_BRANCH

default:
  interruptible: true

services:
  - docker:26.1.1-dind
  - postgres:16.2-bookworm
  - redis:latest

variables:
  AWS_ACCESS_KEY_ID: $AWS_ACCESS_KEY_ID
  AWS_DEFAULT_REGION: $AWS_DEFAULT_REGION
  AWS_SECRET_ACCESS_KEY: $AWS_SECRET_ACCESS_KEY
  POSTGRES_DB: dallinger
  POSTGRES_USER: dallinger
  POSTGRES_PASSWORD: ""
  POSTGRES_HOST_AUTH_METHOD: trust
  DATABASE_URL: postgresql://dallinger@postgres:5432/dallinger
  REDIS_URL: redis://redis:6379
  HEADLESS: "TRUE"
  DOCKER_LOCAL_TAG: psynet-build
  PYTHON_VERSION: "3.13"
  DOCKER_HOST: tcp://docker:2375
  DOCKER_DRIVER: overlay2
  DOCKER_TLS_CERTDIR: ""

before_script:
  - export POSTGRES_IP=$(getent ahostsv4 postgres | awk '{ print $1 }' | tail -n 1)
  - export REDIS_IP=$(getent ahostsv4 redis | awk '{ print $1 }' | tail -n 1)
  - echo $POSTGRES_IP
  - echo $REDIS_IP
  - docker build --build-arg PYTHON_VERSION=$PYTHON_VERSION --tag $DOCKER_LOCAL_TAG .

.default_rules: &default_rules
  rules:
    - if: $CI_MERGE_REQUEST_ID
      when: always
    - if: $CI_COMMIT_BRANCH
      when: always
    - if: $CI_COMMIT_TAG
      when: always

pre_commit:
  image: python:3.13
  <<: *default_rules
  before_script:
    - pip install pre-commit
  script:
    - pre-commit run --all-files

validate_agent_skills:
  image: python:3.13
  <<: *default_rules
  before_script:
    - pip install pyyaml skills-ref
  script:
    - python scripts/validate_agent_skills.py

changelog_check:
  image: python:3.13
  stage: test
  before_script:
    - python -m pip install -e '.[dev]'
  script:
    - |
      git fetch --unshallow origin || git fetch --depth=100 origin
      git fetch origin $CI_MERGE_REQUEST_TARGET_BRANCH_NAME
      MERGE_BASE=$(git merge-base origin/$CI_MERGE_REQUEST_TARGET_BRANCH_NAME HEAD)
      psynet dev changelog check-mr $MERGE_BASE HEAD
  rules:
    # Release branches regenerate CHANGELOG.md from fragments.
    - if: $CI_COMMIT_BRANCH =~ /^release-/ || $CI_MERGE_REQUEST_SOURCE_BRANCH_NAME =~ /^release-/
      when: never
    # Post-release version bumps are release bookkeeping, not user-facing changes.
    - if: $CI_COMMIT_BRANCH == "bump-master-post-release" || $CI_MERGE_REQUEST_SOURCE_BRANCH_NAME == "bump-master-post-release"
      when: never
    - if: $CI_MERGE_REQUEST_ID
      when: always
    - when: never

.release_branch_only: &release_branch_only
  rules:
    - if: $CI_COMMIT_BRANCH =~ /^release-/ || $CI_MERGE_REQUEST_SOURCE_BRANCH_NAME =~ /^release-/
      when: always
    - when: never

# Shared definition of a PsyNet test-suite job, parameterized by PYTHON_VERSION
# and TEST_SCOPE.
#
# run-ci-tests.sh splits tests by CI_NODE_INDEX/CI_NODE_TOTAL, but GitLab owns
# those variables: for `parallel:matrix` jobs it numbers them across all
# permutations rather than within one, so a matrix job cannot set them directly.
# Shard coordinates therefore travel as SHARD_INDEX/SHARD_TOTAL and are mapped
# on to CI_NODE_* below, falling back to GitLab's own numbering when unset. That
# keeps plain `parallel: N` jobs working unchanged while letting matrix jobs
# declare a shard dimension of their own.
.test_suite:
  parallel: 10
  stage: test
  <<: *default_rules
  variables:
    TEST_SCOPE: full
  script:
    - export PSYNET_WORKSPACE=/root/workspaces/PsyNet
    - docker run
      --add-host=postgres:$POSTGRES_IP
      --add-host=redis:$REDIS_IP
      -e HEADLESS=TRUE -e REDIS_URL -e DATABASE_URL -e POSTGRES_DB -e POSTGRES_USER -e POSTGRES_PASSWORD
      -e AWS_ACCESS_KEY_ID -e AWS_DEFAULT_REGION -e AWS_SECRET_ACCESS_KEY
      -e CI
      -e CI_NODE_TOTAL="${SHARD_TOTAL:-$CI_NODE_TOTAL}"
      -e CI_NODE_INDEX="${SHARD_INDEX:-$CI_NODE_INDEX}"
      -e CI_COMMIT_REF_NAME
      -e SKIP_PYTHON_VERSION_CHECK
      -e PYTHON_VERSION -e TEST_SCOPE
      -e PSYNET_WORKSPACE
      -v "$PWD:$PSYNET_WORKSPACE"
      -v "$PWD/public:/public"
      -w $PSYNET_WORKSPACE
      $DOCKER_LOCAL_TAG bash -c "bash run-ci-tests.sh"
  artifacts:
    paths:
      - public/

tests_python_3_13:
  extends: .test_suite
  # Stated explicitly rather than inherited from the global default, so this
  # job keeps testing 3.13 even if the default Python version changes.
  variables:
    PYTHON_VERSION: "3.13"

# To reduce CI cost, non-recommended Python versions (3.11, 3.12, 3.14) are
# only verified on release branches: day-to-day MRs rarely affect version
# compatibility. Note that regular pipelines validate dependency resolution
# only for the default Python version (via the Docker build's `uv pip
# compile`); all supported versions are resolution-checked when maintainers
# run `psynet dev ci update-dallinger-constraints`, and fully tested on
# release-branch pipelines.
tests_python_3_14:
  extends: .test_suite
  <<: *release_branch_only
  variables:
    PYTHON_VERSION: "3.14"
    SKIP_PYTHON_VERSION_CHECK: "1"

# GitLab does not allow combining `parallel: N` with a matrix, so the shard is
# added as its own matrix dimension; see the SHARD_* note on `.test_suite`.
compatibility_tests:
  extends: .test_suite
  <<: *release_branch_only
  parallel:
    matrix:
      - PYTHON_VERSION: ["3.11", "3.12"]
        SHARD_INDEX: ["1", "2", "3", "4", "5"]
        SHARD_TOTAL: "5"
  variables:
    SKIP_PYTHON_VERSION_CHECK: "1"
    TEST_SCOPE: isolated

playwright_e2e_legacy:
  stage: test
  <<: *default_rules
  script:
    - export PSYNET_WORKSPACE=/root/workspaces/PsyNet
    - mkdir -p public test-results
    - docker build --build-arg BASE_IMAGE=$DOCKER_LOCAL_TAG --tag $DOCKER_LOCAL_TAG-playwright -f Dockerfile.playwright .
    - docker run
      --add-host=postgres:$POSTGRES_IP
      --add-host=redis:$REDIS_IP
      -e HEADLESS=TRUE -e REDIS_URL -e DATABASE_URL -e POSTGRES_DB -e POSTGRES_USER -e POSTGRES_PASSWORD
      -e AWS_ACCESS_KEY_ID -e AWS_DEFAULT_REGION -e AWS_SECRET_ACCESS_KEY
      -e PLAYWRIGHT_JUNIT_OUTPUT_NAME=public/playwright-junit-legacy.xml
      -e PSYNET_WORKSPACE
      -e inplace_timeline_transitions=false
      -v "$PWD:$PSYNET_WORKSPACE"
      -w $PSYNET_WORKSPACE
      $DOCKER_LOCAL_TAG-playwright bash -c "uv pip install --no-cache --system --no-deps -e \"$PSYNET_WORKSPACE\" && npm ci && node tests/playwright/check-mode-tags.js && npx playwright test --grep '@both|@legacy-only' --reporter=line,junit,html"
  artifacts:
    when: always
    paths:
      - public/
      - test-results/
      - playwright-report/
    reports:
      junit: public/playwright-junit-legacy.xml

playwright_e2e_default:
  stage: test
  <<: *default_rules
  script:
    - export PSYNET_WORKSPACE=/root/workspaces/PsyNet
    - mkdir -p public test-results
    - docker build --build-arg BASE_IMAGE=$DOCKER_LOCAL_TAG --tag $DOCKER_LOCAL_TAG-playwright -f Dockerfile.playwright .
    - docker run
      --add-host=postgres:$POSTGRES_IP
      --add-host=redis:$REDIS_IP
      -e HEADLESS=TRUE -e REDIS_URL -e DATABASE_URL -e POSTGRES_DB -e POSTGRES_USER -e POSTGRES_PASSWORD
      -e AWS_ACCESS_KEY_ID -e AWS_DEFAULT_REGION -e AWS_SECRET_ACCESS_KEY
      -e PLAYWRIGHT_JUNIT_OUTPUT_NAME=public/playwright-junit-default.xml
      -e PSYNET_WORKSPACE
      -v "$PWD:$PSYNET_WORKSPACE"
      -w $PSYNET_WORKSPACE
      $DOCKER_LOCAL_TAG-playwright bash -c "uv pip install --no-cache --system --no-deps -e \"$PSYNET_WORKSPACE\" && npm ci && node tests/playwright/check-mode-tags.js && npx playwright test --grep '@both|@inplace-only' --reporter=line,junit,html"
  artifacts:
    when: always
    paths:
      - public/
      - test-results/
      - playwright-report/
    reports:
      junit: public/playwright-junit-default.xml

merge_test_results:
  image: python:3.13-alpine
  stage: test
  <<: *default_rules
  needs:
    - "tests_python_3_13"
    # tests_python_3_14 and compatibility_tests only exist on
    # release-branch pipelines.
    - job: "tests_python_3_14"
      optional: true
    - job: "compatibility_tests"
      optional: true
    - "playwright_e2e_legacy"
    - "playwright_e2e_default"
  when: always
  before_script:
    - pip install -q junitparser
  script:
    - ls -la public
    - junitparser merge public/*junit.xml junit.xml || echo "<testsuite></testsuite>" > junit.xml
  artifacts:
    reports:
      junit: junit.xml

# Full ASV suite for default-branch result publishing and regression checking.
# Runs `asv continuous` so the previous and current default-branch commits are
# benchmarked back-to-back on the same runner. Result files are still pushed to
# the benchmark-results branch before the job propagates any regression failure.
asv_benchmarks:
  stage: test
  allow_failure: true
  resource_group: benchmark-results
  variables:
    # Full clone: the previous default-branch commit may be unreachable in the
    # default shallow clone, but we need it as the regression baseline.
    GIT_DEPTH: "0"
    ASV_REGRESSION_FACTOR: "1.25"
  cache:
    key:
      files:
        - pyproject.toml
        - asv.conf.json
    paths:
      - .asv/env/
  script:
    - apk add --no-cache git
    - export PSYNET_WORKSPACE=/root/workspaces/PsyNet
    - export ASV_RESULTS_REMOTE="https://oauth2:${BENCHMARK_RESULTS_TOKEN}@${CI_SERVER_HOST}/${CI_PROJECT_PATH}.git"
    - git config user.email "ci@psynet.dev"
    - git config user.name "PsyNet CI"
    - git branch -f "$CI_COMMIT_REF_NAME" HEAD
    - 'sed -i "s|\"branches\": \[[^]]*\]|\"branches\": [\"$CI_COMMIT_REF_NAME\"]|" asv.conf.json'
    - export ASV_BASE="$(git rev-parse HEAD^1)"
    - export ASV_HEAD="$CI_COMMIT_SHA"
    - echo "Comparing full ASV benchmark suite $ASV_BASE -> $ASV_HEAD"
    - rm -f .asv/asv-benchmarks-status
    - |
      set +e
      docker run \
        --add-host=postgres:$POSTGRES_IP \
        --add-host=redis:$REDIS_IP \
        -e HEADLESS=TRUE -e REDIS_URL -e DATABASE_URL -e POSTGRES_DB -e POSTGRES_USER -e POSTGRES_PASSWORD \
        -e CI -e CI_COMMIT_REF_NAME \
        -e PSYNET_WORKSPACE \
        -e ASV_MACHINE_NAME=gitlab-ci \
        -v "$PWD:$PSYNET_WORKSPACE" \
        -w $PSYNET_WORKSPACE \
        $DOCKER_LOCAL_TAG bash -c "uv pip install --no-cache --system --no-deps -e \"$PSYNET_WORKSPACE\" && uv pip install --no-cache --system asv virtualenv && bash ci/asv-sync-results.sh --continuous --factor \"$ASV_REGRESSION_FACTOR\" --split --show-stderr \"$ASV_BASE\" \"$ASV_HEAD\""
      status=$?
      set -e
      echo "$status" > .asv/asv-benchmarks-status
    - git push "$ASV_RESULTS_REMOTE" benchmark-results
    - exit "$(cat .asv/asv-benchmarks-status)"
  artifacts:
    when: on_failure
    paths:
      - .asv/results/
  rules:
    - if: $CI_COMMIT_REF_NAME == $CI_DEFAULT_BRANCH
      when: always
    - when: never

# Gate merge requests on fast benchmark regressions. Runs `asv continuous`,
# which builds and benchmarks both commits back-to-back on the same runner (so
# runner-to-runner noise cancels out) and exits non-zero if any selected
# benchmark regressed past --factor. Slow end-to-end experiment benchmarks stay
# out of the MR gate and run only in the default-branch result publishing job
# above. The base is the MR's merge base with the target branch
# (CI_MERGE_REQUEST_DIFF_BASE_SHA), and the head is the source branch tip --
# comparing those two real commits isolates exactly the MR's own changes,
# independent of how far master has moved. Results are not committed to the
# benchmark-results branch; this job is a gate only.
asv_regression:
  stage: test
  # Still allows for a cold .asv/env cache and Docker startup, but the selected
  # benchmark set should remain small enough for normal MR iteration.
  timeout: 45m
  variables:
    # Full clone: the merge base can be far back in the target branch's
    # history and is otherwise unreachable in the default shallow clone.
    GIT_DEPTH: "0"
    ASV_FAST_BENCHMARKS: "^fast\\."
  cache:
    key:
      files:
        - pyproject.toml
        - asv.conf.json
    paths:
      - .asv/env/
  script:
    - apk add --no-cache git
    - export PSYNET_WORKSPACE=/root/workspaces/PsyNet
    # The full clone above already has the source tip and the merge base;
    # fetch the target branch as a defensive backstop. Fetching the source
    # branch by name is avoided -- it fails for fork-originated merge requests.
    - git fetch origin "$CI_MERGE_REQUEST_TARGET_BRANCH_NAME"
    - export ASV_BASE="$CI_MERGE_REQUEST_DIFF_BASE_SHA"
    # SOURCE_BRANCH_SHA is set in merged-results pipelines; in a standard MR
    # pipeline it is empty and CI_COMMIT_SHA is itself the source branch tip.
    - export ASV_HEAD="${CI_MERGE_REQUEST_SOURCE_BRANCH_SHA:-$CI_COMMIT_SHA}"
    - echo "Comparing benchmark base $ASV_BASE -> head $ASV_HEAD"
    - 'echo "Running fast ASV benchmark selector: $ASV_FAST_BENCHMARKS"'
    - docker run
      --add-host=postgres:$POSTGRES_IP
      --add-host=redis:$REDIS_IP
      -e HEADLESS=TRUE -e REDIS_URL -e DATABASE_URL -e POSTGRES_DB -e POSTGRES_USER -e POSTGRES_PASSWORD
      -e CI
      -e PSYNET_WORKSPACE
      -e ASV_MACHINE_NAME=gitlab-ci
      -v "$PWD:$PSYNET_WORKSPACE"
      -w $PSYNET_WORKSPACE
      $DOCKER_LOCAL_TAG bash -c "uv pip install --no-cache --system --no-deps -e \"$PSYNET_WORKSPACE\" && uv pip install --no-cache --system asv virtualenv && asv machine --yes --machine gitlab-ci && asv continuous --factor 1.25 --split --show-stderr --bench \"$ASV_FAST_BENCHMARKS\" $ASV_BASE $ASV_HEAD"
  rules:
    - if: $CI_MERGE_REQUEST_SOURCE_BRANCH_NAME == "issues/9123-performance-benchmark-site"
      when: never
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      when: always
    - when: never

# Manual, on-demand load sweep. Runs `psynet performance-test` across a range of
# concurrency levels for each benchmarked demo to locate the throughput "knee"
# on GitLab runner hardware -- the data needed to tune the n_bots and duration
# of the ASV experiment benchmarks. It is offered on every pipeline as a
# manual job.
benchmark_load_sweep:
  stage: test
  resource_group: benchmark-results
  timeout: 90m
  script:
    - export PSYNET_WORKSPACE=/root/workspaces/PsyNet
    - mkdir -p public
    - docker run
      --add-host=postgres:$POSTGRES_IP
      --add-host=redis:$REDIS_IP
      -e HEADLESS=TRUE -e REDIS_URL -e DATABASE_URL -e POSTGRES_DB -e POSTGRES_USER -e POSTGRES_PASSWORD
      -e CI
      -e PSYNET_WORKSPACE
      -v "$PWD:$PSYNET_WORKSPACE"
      -w $PSYNET_WORKSPACE
      $DOCKER_LOCAL_TAG bash -c 'uv pip install --no-cache --system --no-deps -e "$PSYNET_WORKSPACE" && sweep() { echo "=== load sweep $2 ==="; ( cd "$1" && psynet performance-test local --n-bots "$3" --duration-minutes "$4" --json-output "$PSYNET_WORKSPACE/public/sweep-$2.json" ); } && sweep demos/experiments/static static "5,6,7" 2.0 && sweep demos/experiments/timeline timeline "8,12,16,24" 5.0 && sweep tests/experiments/static_big static_big "5,6" 2.0 && python3 ci/perf-sweep-report.py public/sweep-*.json | tee public/sweep-report.md'
  artifacts:
    when: always
    paths:
      - public/sweep-*.json
      - public/sweep-report.md
  rules:
    - when: manual
      allow_failure: true

# Build this commit's Sphinx docs without publishing. Catches install/import
# and autodoc failures on MRs and branches; the ``pages`` job remains the
# multi-version publish path for the default branch and release tags.
docs:build:
  image: python:3.13
  stage: test
  <<: *default_rules
  before_script: []
  script:
    - python -m pip install -e '.[dev]'
    - sphinx-build -b html docs public/docs-ci
  artifacts:
    when: on_failure
    paths:
      - public/docs-ci/
    expire_in: 1 week

# To do:
# - Skip tests if the changes are only in the docs directory
# Build and publish the multi-version docs site to GitLab Pages.
# Build logic lives in docs/scripts/build_pages.sh; this job is a thin
# wrapper that supplies the image, cache, artifacts, and rules.
pages:
  image: python:3.13
  stage: deploy
  variables:
    # Single absolute URL so every versioned subdir loads the same JSON.
    # Without this, each subdir's HTML embeds a relative
    # `_static/version_switcher.json` reference and a per-subdir copy
    # of the file, so updating the switcher would require rewriting
    # every subdir.
    DOCS_VERSION_SWITCHER_JSON: "https://psynetdev.gitlab.io/PsyNet/_static/version_switcher.json"
  cache:
    key: psynet-versioned-docs-cache
    paths:
      - public/
    policy: pull-push
  before_script: []
  script:
    - bash docs/scripts/build_pages.sh
    - export ASV_RESULTS_REMOTE="https://oauth2:${BENCHMARK_RESULTS_TOKEN}@${CI_SERVER_HOST}/${CI_PROJECT_PATH}.git"
    - |
      if git ls-remote --exit-code --heads "$ASV_RESULTS_REMOTE" benchmark-results >/dev/null 2>&1; then
        git fetch "$ASV_RESULTS_REMOTE" benchmark-results:benchmark-results
        git branch -f "$CI_COMMIT_REF_NAME" HEAD
        sed -i "s|\"branches\": \[[^]]*\]|\"branches\": [\"$CI_COMMIT_REF_NAME\"]|" asv.conf.json
        git worktree add .asv/results benchmark-results
        asv publish
        mkdir -p public/benchmarks
        cp -a .asv/html/. public/benchmarks/
        git worktree remove --force .asv/results
      else
        echo "benchmark-results branch not on remote yet; skipping asv publish"
      fi
  pages: true
  artifacts:
    paths:
    - public
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
      when: always
    - if: $CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+((rc|a)\d+)?$/
      when: always
    - when: never
