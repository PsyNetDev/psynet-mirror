{% macro shared_canvas_control(params) %}
<div class="canvas-shell">
  <h2>Shared canvas</h2>
  <div class="bonus-pill">Coin bonus: $<span id="coin-bonus">0.00</span></div>
  <canvas id="shared-canvas" width="{{ params.canvas_config.canvas_size }}" height="{{ params.canvas_config.canvas_size }}" tabindex="0" aria-label="Shared canvas arrow-key navigation area"></canvas>
  <p class="canvas-help">Use the arrow keys to move. Collect the gold coins before the session ends.</p>
</div>
{% endmacro %}
