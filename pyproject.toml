[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

# Hatchling rejects git/URL dependencies unless this is set. Keep it so
# temporary Dallinger (or other) git pins can be published as local wheels.
[tool.hatch.metadata]
allow-direct-references = true

[project]
name = "psynet"
version = "15.0.0a0"
authors = [
  {name="Peter Harrison", email="pmch2@cam.ac.uk"},
  {name="Frank Höger", email="frank.hoeger@ae.mpg.de"},
  {name="Pol van Rijn", email="pol.van-rijn@ae.mpg.de"},
  {name="Raja Marjieh", email="raja.marjieh@princeton.edu"},
  {name="Nori Jacoby", email="nori.jacoby@ae.mpg.de"}
]
maintainers = [
  {name = "Peter Harrison", email = "pmch2@cam.ac.uk"}
]
license = {file = "LICENSE"}
description = "PsyNet – complex psychological experiments made easy"  # A framework for running advanced psychological experiments
keywords = ["psychology", "experiments", "online", "networks"]
readme = "README.md"
requires-python = ">=3.11"  # recommended Python version: 3.14
classifiers = [
    "Development Status :: 4 - Beta",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.11",
    "Framework :: Flask",
    "Operating System :: POSIX",
    "License :: OSI Approved :: MIT License",
    "Intended Audience :: Science/Research",
]

# Minimal core: only what is needed to run bootstrap commands
# (psynet setup, psynet scripts …, psynet services …, psynet generate-constraints).
# Service probes and version checks avoid psycopg2 / redis / yaspin so core stays
# free of experiment runtime packages; those arrive via psynet[experiment].
# Experiment authors need psynet[experiment] (installed automatically by `psynet setup`).
dependencies = [
    "click",
    "packaging",
]

[project.optional-dependencies]
# Experiment runtime, which `psynet setup` installs via constraints.txt.
# PsyNet source and docs installs use ``dev``, which includes it.
# List every package that PsyNet's runtime imports, even when Dallinger already
# installs it, so that PsyNet doesn't break if Dallinger drops one.
experiment = [
    "arabic-reshaper",  # VocabTest
    "babel",
    "beautifulsoup4",
    "boto3",
    "botocore",
    # 13.1.0 runs local PostgreSQL 18, which `psynet services ensure` matches.
    # Pinned to a commit on the Dallinger#10459 branch (CPU queues), which also
    # contains Dallinger#10431 (live game runner stats), until they are released.
    "dallinger[docker] @ git+https://github.com/Dallinger/Dallinger.git@86348cff902e7467db7182d105ee000b9cbec0bf",
    "debugpy",
    "dominate>=3.1",
    "flask",
    "flask-login",
    "gevent",
    "html2text",
    "itsdangerous",
    "jinja2",
    "joblib",
    "jsonpickle",
    "markdown-it-py",  # Audit reports
    "markupsafe",
    "numpy",
    "pandas",
    "paramiko",
    "pexpect",
    "pillow",  # VocabTest
    "polib",
    "psutil",
    "psycopg2",
    "pydantic>=2.12,<3",
    "pygments>=2.20.0",  # Audit reports; minimum excludes CVE-2026-4539
    "pytest",
    "redis",
    "requests",
    "rich",
    "rpdb",  # For `import rpdb; rpdb.set_trace()` in experiment code
    "rq",
    "selenium",
    "slack-sdk",  # Slack notifier
    "sqlalchemy",
    "tabulate",
    "tenacity",
    "tomlkit",
    "tqdm",
    "urllib3",
    "werkzeug",
    "yaspin",
]
# PsyNet source development and docs: runtime plus tooling.
# Demo-only packages stay in ``demos`` so docs/CI installs stay lean.
dev = [
    "psynet[experiment,test]",
    "asv",
    "citeproc-py",
    "myst-parser",
    "openai",
    "pre-commit",
    "pydata-sphinx-theme",
    "ruff",
    "sphinx",
    "sphinx-autobuild",
    "sphinx-autodoc-typehints<3.0.0",
    "sphinx-copybutton",
    "sphinx-design",
    "sphinx-inline-tabs",
    "sphinx-reredirects",
    "virtualenv",
]
# Pytest plugins for PsyNet's own test suite, which the CI image installs
# without the rest of ``dev``.
test = [
    "pytest-dependency",
    "pytest-mock",
    "pytest-timeout",
]
demos = [
    "music21",
    "praat-parselmouth",
    "psynet-step==0.1.0",
    "repp-tapping",
    "scipy",
    "sing4me",
    "soundfile",
    "statsmodels",
]

[project.entry-points."psynet.static"]
psynet = "psynet.static_resources:psynet_static_root"

[project.entry-points.pytest11]
pytest_psynet = "psynet.pytest_psynet"

[project.scripts]
psynet = "psynet.bootstrap_cli:main"

[project.urls]
Changelog = "https://gitlab.com/PsyNetDev/PsyNet/-/blob/master/CHANGELOG.md"
Documentation = "https://psynetdev.gitlab.io/PsyNet/"
Homepage = "https://www.psynet.dev/"
Issues = "https://gitlab.com/PsyNetDev/PsyNet/-/issues"
Repository = "https://gitlab.com/PsyNetDev/PsyNet/"

# Built by `psynet dev docs bundle` for `psynet docs`; gitignored, so it must
# be listed as an artifact to reach the sdist and wheel.
[tool.hatch.build]
artifacts = ["/psynet/resources/docs_text"]

[tool.hatch.build.targets.wheel]
include = ["/psynet"]

[tool.hatch.build.targets.wheel.force-include]
".cursor/skills/experiment" = "psynet/resources/experiment_scripts/.cursor/skills/psynet"

[tool.hatch.build.targets.sdist]
exclude = [
    "/.gitlab",
    "/postgres_setup.sql",
    "/run-ci-tests-locally-v2.sh",
    "/.venv*",
    "/ci",
    "/demos",
    "/docs",
    "/tests",
]

[tool.pytest.ini_options]
# Must be loaded with -p, before Dallinger connects; see psynet/isolated_environment.py.
addopts = "-p psynet.pytest_environment"
norecursedirs = [
    "tests/experiments",
    "tests/isolated",
    "tests/template_experiment_tests",
]

[tool.ruff]
line-length = 88
target-version = "py311"
builtins = ["_"]
extend-exclude = [
    ".cache",
    ".eggs",
    ".git",
    ".hg",
    ".mypy_cache",
    ".tox",
    ".venv",
    "__pycache__",
    "bin",
    "build",
    "dist",
    "docs/_build",
    "lib",
    "src",
    # Vendored copies of the shared IRB consent modules from
    # https://gitlab.com/computational-audition-lab/cococo-shared;
    # kept byte-identical to each other (not linted/formatted here).
    # They may diverge from upstream when PsyNet needs a local template fix.
    "tests/deployment/audio_gibbs/consents_cococo",
    "tests/deployment/auto_recruit_prolific/consents_cococo",
    "tests/deployment/payment_flows_prolific/consents_cococo",
]

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = ["E203", "E501"]
